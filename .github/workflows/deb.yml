name: Deb build

on:
  push:
    tags:
      - 'jp-v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  deb-build:
    if: github.repository == 'whitehara/umoria-jp'
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    permissions:
      contents: write
    steps:
      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git ca-certificates build-essential debhelper cmake \
            libncursesw5-dev pkg-config

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify spec/changelog versions agree
        if: github.event_name == 'push'
        run: bash scripts/check-versions.sh "${GITHUB_REF_NAME}"

      - name: Build .deb
        run: bash scripts/make-deb.sh

      - name: Upload .deb as artifact (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: umoria-jp-deb
          path: deb-out/*.deb

      - name: Create GitHub Release with .deb attached
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: deb-out/*.deb
